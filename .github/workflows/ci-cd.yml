
name: Maven Docker CI-CD

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Git Checkout
      - name: Git Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Compile and Build
      - name: Maven Build
        run: mvn clean package

      # 4. Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker Build
      - name: Docker Build
        run: docker build -t adarshjohn851/jenkins-nginx:latest .

      # 6. Docker Push
      - name: Docker Push
        run: docker push adarshjohn851/jenkins-nginx:latest
